name: OFZ Assistant Bot

on:
  schedule:
    - cron: '0 17 * * *'  # 20:00 MSK
  workflow_dispatch:      # Возможность запустить вручную

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          TINKOFF_TOKEN: ${{ secrets.TINKOFF_TOKEN }}
          TINKOFF_TOKEN_2: ${{ secrets.TINKOFF_TOKEN_2 }}
          SSL_TBANK_VERIFY: "True"
        run: python main.py

      - name: Generate HTML Report
        run: python generate_html.py

      - name: Archive old reports
        run: python archive_reports.py

      - name: Commit and push reports
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update reports [skip ci]" && git push)
